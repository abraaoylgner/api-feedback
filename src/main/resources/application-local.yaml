spring:
  application:
    name: api-feedback

  cloud:
    function:
      definition: processarAvaliacao;gerarRelatorioSemanal

  datasource:
    url: jdbc:postgresql://localhost:5432/feedback_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configurações simuladas/locais para a AWS e aplicação
app:
  sqs:
    fila-criticas: fila-notas-criticas
  mail:
    admin: admin@fiap.com

# Força a região estática da AWS para São Paulo (sa-east-1)
spring.cloud.aws:
  region:
    static: sa-east-1
  ses:
    enabled: false
  sqs:
    enabled: false

logging:
  level:
    com.pos.tech.challenge.feedback: DEBUG