spring:
  application:
    name: api-feedback

  # Configuração do PostgreSQL
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/feedback_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  # Configuração do Hibernate/JPA
  jpa:
    hibernate:
      # O "update" cria as tabelas automaticamente. (Em produção real usa-se Flyway/Liquibase).
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Variáveis customizadas da nossa aplicação
app:
  sqs:
    fila-criticas: ${SQS_FILA_CRITICAS:fila-notas-criticas}