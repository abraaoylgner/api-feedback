spring:
  application:
    name: api-feedback

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/feedback_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  sqs:
    fila-criticas: ${SQS_FILA_CRITICAS:fila-notas-criticas}
  mail:
    admin: ${ADMIN_EMAIL:admin@fiap.com}