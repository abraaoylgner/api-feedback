AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Plataforma Serverless de Feedback de Aulas - Tech Challenge Fase 4

Globals:
  Function:
    Timeout: 15
    MemorySize: 1024
    Runtime: java21
    CodeUri: target/api-feedback-0.0.1-SNAPSHOT-aws.jar
    Architectures:
      - x86_64
    Environment:
      Variables:
        DB_URL: '{{resolve:ssm:/feedback/db_url}}'
        DB_USER: '{{resolve:ssm:/feedback/db_user}}'
        DB_PASS: '{{resolve:ssm:/feedback/db_pass}}'
        SQS_FILA_CRITICAS: !GetAtt FilaNotasCriticas.QueueName
        ADMIN_EMAIL: 'admin@fiap.com'

Resources:
  # 1. Fila SQS para Eventos de Avaliações Críticas
  FilaNotasCriticas:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: fila-notas-criticas

  # 2. Função Serverless 1: Recepção, Triagem e Alerta Crítico (POST /avaliacao)
  ProcessarAvaliacaoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      SnapStart:
        ApplyOn: PublishedVersions
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: processarAvaliacao
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /avaliacao
            Method: post
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt FilaNotasCriticas.QueueName
        - SESSendEmailPolicy:
            IdentityName: 'admin@fiap.com'

  # 3. Função Serverless 2: Geração e Envio do Relatório Semanal (CRON)
  GerarRelatorioSemanalFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      SnapStart:
        ApplyOn: PublishedVersions
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: gerarRelatorioSemanal
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 8 ? * MON *)
      Policies:
        - SESSendEmailPolicy:
            IdentityName: 'admin@fiap.com'

  # 4. Monitoramento: Alarme CloudWatch para Falhas na Função de Ingestão
  AlarmeErroProcessarAvaliacao:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: api-feedback-erros-processar-avaliacao
      AlarmDescription: Dispara alerta caso ocorram erros na funcao serverless de avaliacao
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessarAvaliacaoFunction